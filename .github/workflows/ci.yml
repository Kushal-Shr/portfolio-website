# CI/CD: every push and pull request runs the checks and the browser tests. Only when both pass
# does the site deploy to Vercel: production for `main`, a preview for pull requests.
# Vercel's own Git auto-deploy is switched off in vercel.json, so this is the only way in.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID      `orgId` in .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  `projectId` in the same file

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes the older run pointless; on main every commit finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@65.12.1

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      # The screenshot comparisons are skipped here (see playwright.config.ts): their baselines
      # are rendered on macOS, and Linux draws the same font a pixel differently.
      - run: pnpm test:e2e
      - name: Keep the failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: [check, e2e]
    # Pull requests from forks get no secrets, so they stop at the tests.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploys never overlap or get cancelled halfway: the newest one simply lands last.
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - name: Check the Vercel secrets are set
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing the $name secret. See the setup notes at the top of .github/workflows/ci.yml."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull the Vercel project settings and environment variables
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      - name: Build
        run: |
          if [ "$TARGET" = production ]; then
            pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          else
            pnpm dlx "$VERCEL_CLI" build --token="$VERCEL_TOKEN"
          fi
      # Canonical links, the sitemap and link previews all use the site URL; a production build
      # without it would point them at the placeholder.
      - name: Check the site URL is set
        if: env.TARGET == 'production'
        run: |
          if grep -rqs 'https://example.com' .vercel/output/static; then
            echo "::error::The build still uses https://example.com. Set NEXT_PUBLIC_SITE_URL in Vercel → Project → Settings → Environment Variables (Production)."
            exit 1
          fi
      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = production ]; then
            url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
