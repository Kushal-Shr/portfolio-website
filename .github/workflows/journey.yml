# Publishes journey entries pushed on a branch (for example by a Claude Code cloud session),
# with no pull request to merge. When a branch adds or changes nothing but journey entries
# (content/journey/YYYY-MM-DD.md), this validates them on top of `main`, commits them to `main`
# under the original author, deletes the branch and starts the CI/CD workflow, which runs the
# full tests and deploys. A branch that changes anything else is left alone for a normal review.

name: Publish journey entry

on:
  push:
    branches-ignore: [main]

# One publish at a time, so two entries never race each other onto main.
concurrency:
  group: journey-publish
  cancel-in-progress: false

permissions:
  contents: write # commit to main, delete the branch
  actions: write # start the CI/CD workflow

jobs:
  publish:
    name: Publish to main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this branch only touch journey entries?
        id: scope
        run: |
          git fetch --quiet origin main
          changes=$(git diff --name-status origin/main...HEAD)
          files=""
          only_journey=true
          while IFS=$'\t' read -r status path; do
            [ -z "$status" ] && continue
            if [[ "$status" =~ ^[AM]$ && "$path" =~ ^content/journey/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]; then
              files="$files $path"
            else
              only_journey=false
            fi
          done <<< "$changes"
          if [ -z "$files" ] || [ "$only_journey" != true ]; then
            echo "Not a journey-only branch; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "files=${files# }" >> "$GITHUB_OUTPUT"
          fi

      - name: Put the entries on top of main
        if: steps.scope.outputs.publish == 'true'
        env:
          FILES: ${{ steps.scope.outputs.files }}
        run: |
          git checkout --quiet -B publish origin/main
          # shellcheck disable=SC2086
          git checkout "$GITHUB_SHA" -- $FILES

      - uses: pnpm/action-setup@v4
        if: steps.scope.outputs.publish == 'true'
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.scope.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      # The same check that guards main: a bad entry stops here, and main never breaks.
      - name: Validate
        if: steps.scope.outputs.publish == 'true'
        run: pnpm journey:check && pnpm check

      - name: Commit to main and start the deploy
        if: steps.scope.outputs.publish == 'true'
        env:
          FILES: ${{ steps.scope.outputs.files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # shellcheck disable=SC2086
          git add -- $FILES
          if git diff --cached --quiet; then
            echo "These entries are already on main." >> "$GITHUB_STEP_SUMMARY"
          else
            author=$(git log -1 --format='%an <%ae>' "$GITHUB_SHA")
            dates=$(for f in $FILES; do basename "$f" .md; done | sort | paste -sd ' ' -)
            git commit --quiet --author="$author" -m "journey: $dates"
            # main may have moved since the checkout: rebase and retry a few times.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              [ "$attempt" = 3 ] && exit 1
              git pull --rebase --quiet origin main
            done
            echo "Published journey: $dates" >> "$GITHUB_STEP_SUMMARY"
            # A push made with the workflow's own token doesn't start other workflows, so start
            # the CI/CD run (tests, then deploy) on main explicitly.
            gh workflow run ci.yml --ref main
          fi
          git push origin --delete "$GITHUB_REF_NAME" || true
